services:
  - type: web
    name: namhan-measurement-map
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    disk:
      name: measurement-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/measurement.db
      - key: DEVICE_API_KEY
        generateValue: true
      - key: DELETE_API_KEY
        generateValue: true
